name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]*'
  pull_request:
    branches:
      - main
      - 'v[0-9]*'

jobs:
  PHP:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['^11.0', '^12.0', '^13.0']
        include:
          - laravel: '^11.0'
            testbench: '^9.0'
          - laravel: '^12.0'
            testbench: '^10.0'
          - laravel: '^13.0'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress --prefer-stable -W

      - name: Laravel Pint - Lint test
        run: composer test:lint

      - name: PHPStan - Static Analysis test
        run: composer test:types

      - name: Pest - Unit test
        run: composer test:unit
